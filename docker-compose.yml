services:
  postgres:
    image: postgres:16-alpine
    container_name: tempobase-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: tempobase
    ports:
      - "5434:5432"
    volumes:
      - tempobase_lite_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tempobase"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        DATABASE_URL: postgresql://postgres:localdev@postgres:5432/tempobase
        DIRECT_DATABASE_URL: postgresql://postgres:localdev@postgres:5432/tempobase
        NEXTAUTH_URL: http://localhost:3000
    container_name: tempobase-app
    environment:
      DATABASE_URL: "postgresql://postgres:localdev@postgres:5432/tempobase"
      DIRECT_DATABASE_URL: "postgresql://postgres:localdev@postgres:5432/tempobase"
      NEXTAUTH_URL: "http://localhost:3000"
      # No default: Auth.js refuses to sign sessions without a secret. Set it in .env
      # (openssl rand -base64 32); a shared placeholder would let anyone forge sessions.
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-}"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tempobase_lite_postgres_data:
